<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spécimens typo Necess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Schibsted+Grotesk:wght@400;700&family=Barlow+Semi+Condensed:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Encode+Sans:wdth,wght@75..100,400..700&family=Familjen+Grotesk:wght@400;700&family=Red+Hat+Text:wght@400;600&family=Sometype+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=block">
<style>
body{margin:0;background:#f4f3ef;color:#1d1f1e;font-family:system-ui}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.s{padding:16px 18px;border-bottom:1px solid #ccc;border-right:1px solid #ccc}
.s.dark{background:#17191a;color:#e9e8e3}
.tag{font:11px/1 monospace;opacity:.6;margin-bottom:8px}
.n{font-size:22px;line-height:1.15;margin:0 0 4px}
.m{font-size:15px;margin:0 0 6px}
.d{font-size:13px;font-variant-numeric:tabular-nums;margin:0}
.p{font-size:16px;line-height:1.45;margin:8px 0 0;max-width:34em}
</style></head><body><div class="grid" id="g"></div>
<script>
const F=[["Atkinson Hyperlegible Next",""],["Schibsted Grotesk",""],["Barlow Semi Condensed",""],["IBM Plex Sans Condensed",""],["Encode Sans","font-stretch:75%"],["Familjen Grotesk",""],["Red Hat Text",""],["Sometype Mono",""],["IBM Plex Mono",""]];
const g=document.getElementById('g');
for(const [f,x] of F){for(const dark of [0,1]){const d=document.createElement('div');d.className='s'+(dark?' dark':'');d.style.cssText=`font-family:'${f}';${x}`;
d.innerHTML=`<div class="tag">${f}${x?' (75%)':''}${dark?' · sombre':''}</div>
<p class="n" style="font-weight:700">Eau de toilette Intense — version bouchon doré</p>
<p class="m">Biotherm · Gel douche exfoliant à l'huile d'abricot</p>
<p class="d">100 ml ℮ · 250 ml · 50 g — 12,90 € · +0,40 € · 0O Il1 · prix de mars 2026</p>
<p class="p">Rien à racheter. Ton nécessaire est complet. La photo n'a pas été enregistrée : réessaie quand tu veux.</p>`;g.appendChild(d)}}
</script></body></html>
