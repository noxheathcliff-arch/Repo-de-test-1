<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trousse</title>
  <meta name="description" content="Votre liste de produits d'hygiène et de cosmétiques, avec les prix et une estimation avant d'aller acheter.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applique le thème avant le premier rendu pour éviter un flash de couleur.
    try {
      var s = JSON.parse(localStorage.getItem('trousse:v1') || '{}');
      var t = s.settings && s.settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <div class="shell">
    <nav class="nav" aria-label="Navigation principale">
      <a class="nav__item" href="#/listes" data-nav="listes">

      </a>

            <svg class="icon icon--filled" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l-5.5 9h11L12 2zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zM3 21.5h8v-8H3v8z"/></svg>
        </span>

  </div>

  <div id="overlay-root"></div>

  <script src="app.js"></script>
